name: chinafix-sign
on:
  schedule:
    # 每天主签到：UTC 17:33 = 北京 01:33；五个项目错峰，避开 UTC 00~02 调度高峰
    - cron: "33 17 * * *"
  workflow_dispatch: # 支持在 Actions 页面手动运行
  push:
    branches: [main, master] # 提交本文件也会立即自动运行一次（用于补签）
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 给随机延迟留足时间（RANDOM_DELAY 建议不超过 45~60）
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run sign-in
        run: python chinafix_sign.py
        env:
          CHINAFIX_COOKIE: ${{ secrets.CHINAFIX_COOKIE }}
          RANDOM_DELAY: ${{ secrets.RANDOM_DELAY }}     # 随机延迟最大分钟数，如 30；不配置=不延迟
          COOKIE_SET_DATE: ${{ secrets.COOKIE_SET_DATE }}# 上次设置Cookie日期 YYYY-MM-DD，用于到期提醒（不想要提醒就别配）
          REMIND_BEFORE: ${{ secrets.REMIND_BEFORE }}  # 提前几天提醒更换，默认 27
          # —— 可选通知，按需在 Secrets 中配置，不配置可留空 ——
          QYWX_AM: ${{ secrets.QYWX_AM }}              # 企业微信自建应用（与青龙 QYWX_AM 同字符串）
          SENDKEY: ${{ secrets.SENDKEY }}              # Server酱 SendKey
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}    # Telegram Bot Token
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}        # Telegram Chat ID
          BARK_URL: ${{ secrets.BARK_URL }}            # Bark key 或完整地址
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}  # 企业微信群机器人完整 webhook


  heartbeat:
    name: 上报成功心跳
    needs: sign
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Healthchecks
        run: |
          U="${{ vars.HC_PING_URL }}"
          if [ -z "$U" ]; then
            echo "[心跳] 未配置 HC_PING_URL，跳过"
            exit 0
          fi
          if curl -fsS --max-time 15 --retry 2 "$U"; then
            echo "[心跳] 已上报成功"
          else
            echo "[心跳] 上报失败（不影响签到结果）"
          fi
